name: Discord notifications

on:
  repository_dispatch:
    types: [voting-started, day-poll-started]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: ${{ github.event.action }}
          VOTING_ID: ${{ github.event.client_payload.voting_id }}
          POLL_ID: ${{ github.event.client_payload.poll_id }}
          POLL_DATE: ${{ github.event.client_payload.date }}
        run: bash .github/scripts/discord-notify.sh
